<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanban Board</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 24px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px; }
    header span { font-size: 0.85rem; color: #64748b; }

    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      align-items: start;
    }

    .column {
      background: #1e2130;
      border-radius: 12px;
      padding: 16px;
      min-height: 200px;
    }

    .column-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .column-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
    }
    .col-todo    .dot { background: #60a5fa; }
    .col-doing   .dot { background: #f59e0b; }
    .col-qa      .dot { background: #c084fc; }
    .col-done    .dot { background: #34d399; }

    .count {
      background: #2d3148;
      color: #94a3b8;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
    }

    .cards { display: flex; flex-direction: column; gap: 10px; }

    .card {
      background: #262b3d;
      border: 1px solid #2d3148;
      border-radius: 8px;
      padding: 12px 14px;
      cursor: grab;
      transition: box-shadow 0.15s, transform 0.15s, border-color 0.15s;
      position: relative;
    }
    .card:hover { border-color: #3d4468; box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
    .card.dragging { opacity: 0.4; cursor: grabbing; }

    .card-title {
      font-size: 0.92rem;
      font-weight: 500;
      line-height: 1.4;
      word-break: break-word;
      padding-right: 20px;
    }
    .card-meta {
      margin-top: 8px;
      font-size: 0.75rem;
      color: #64748b;
    }
    .card-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 600;
      margin-top: 8px;
    }
    .tag-feature { background: #1e3a5f; color: #60a5fa; }
    .tag-bug     { background: #3b1a1a; color: #f87171; }
    .tag-design  { background: #2d1a3b; color: #c084fc; }
    .tag-docs    { background: #1a2d1a; color: #6ee7b7; }

    .card-delete {
      position: absolute;
      top: 8px; right: 8px;
      background: none;
      border: none;
      color: #475569;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.15s, background 0.15s;
      display: none;
    }
    .card:hover .card-delete { display: block; }
    .card-delete:hover { color: #f87171; background: #3b1a1a; }

    .drop-zone {
      min-height: 60px;
      border: 2px dashed transparent;
      border-radius: 8px;
      transition: border-color 0.15s, background 0.15s;
    }
    .drop-zone.over {
      border-color: #3d5afe55;
      background: #1a1f33;
    }

    .add-btn {
      margin-top: 12px;
      width: 100%;
      background: none;
      border: 1px dashed #2d3148;
      color: #64748b;
      border-radius: 8px;
      padding: 9px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .add-btn:hover {
      border-color: #60a5fa55;
      color: #94a3b8;
      background: #1a1f33;
    }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      opacity: 0; pointer-events: none;
      transition: opacity 0.15s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }

    .modal {
      background: #1e2130;
      border: 1px solid #2d3148;
      border-radius: 14px;
      padding: 24px;
      width: 380px;
      max-width: 95vw;
      transform: translateY(-10px);
      transition: transform 0.15s;
    }
    .modal-overlay.open .modal { transform: translateY(0); }

    .modal h2 { font-size: 1rem; font-weight: 600; margin-bottom: 16px; }

    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 6px; }
    .field input, .field textarea, .field select {
      width: 100%;
      background: #262b3d;
      border: 1px solid #2d3148;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 0.9rem;
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus, .field textarea:focus, .field select:focus {
      border-color: #60a5fa;
    }
    .field textarea { resize: vertical; min-height: 70px; }
    .field select option { background: #1e2130; }

    .modal-actions {
      display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px;
    }
    .btn {
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-cancel { background: #2d3148; color: #94a3b8; }
    .btn-add    { background: #3d5afe; color: #fff; }
  </style>
</head>
<body>

<header>
  <h1>Kanban Board</h1>
  <span id="total-count">0 cards</span>
</header>

<div class="board">
  <div class="column col-todo" id="col-todo">
    <div class="column-header">
      <div class="column-title"><span class="dot"></span> To Do</div>
      <span class="count" id="count-todo">0</span>
    </div>
    <div class="cards drop-zone" id="cards-todo"></div>
    <button class="add-btn" onclick="openModal('todo')">+ Add card</button>
  </div>

  <div class="column col-doing" id="col-doing">
    <div class="column-header">
      <div class="column-title"><span class="dot"></span> In Progress</div>
      <span class="count" id="count-doing">0</span>
    </div>
    <div class="cards drop-zone" id="cards-doing"></div>
    <button class="add-btn" onclick="openModal('doing')">+ Add card</button>
  </div>

  <div class="column col-qa" id="col-qa">
    <div class="column-header">
      <div class="column-title"><span class="dot"></span> In QA</div>
      <span class="count" id="count-qa">0</span>
    </div>
    <div class="cards drop-zone" id="cards-qa"></div>
    <button class="add-btn" onclick="openModal('qa')">+ Add card</button>
  </div>

  <div class="column col-done" id="col-done">
    <div class="column-header">
      <div class="column-title"><span class="dot"></span> Done</div>
      <span class="count" id="count-done">0</span>
    </div>
    <div class="cards drop-zone" id="cards-done"></div>
    <button class="add-btn" onclick="openModal('done')">+ Add card</button>
  </div>
</div>

<!-- Add Card Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2>New Card</h2>
    <div class="field">
      <label>Title *</label>
      <input type="text" id="inp-title" placeholder="What needs to be done?" />
    </div>
    <div class="field">
      <label>Description</label>
      <textarea id="inp-desc" placeholder="Optional details…"></textarea>
    </div>
    <div class="field">
      <label>Tag</label>
      <select id="inp-tag">
        <option value="">None</option>
        <option value="feature">Feature</option>
        <option value="bug">Bug</option>
        <option value="design">Design</option>
        <option value="docs">Docs</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn btn-add" onclick="addCard()">Add Card</button>
    </div>
  </div>
</div>

<script>
  const COLS = ['todo', 'doing', 'qa', 'done'];
  let data = JSON.parse(localStorage.getItem('kanban') || '{"todo":[],"doing":[],"qa":[],"done":[]}');
  if (!data.qa) data.qa = [];
  let targetCol = null;
  let dragId = null;

  function save() { localStorage.setItem('kanban', JSON.stringify(data)); }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

  function tagClass(tag) {
    return tag ? `card-tag tag-${tag}` : '';
  }

  function renderAll() {
    COLS.forEach(col => {
      const zone = document.getElementById('cards-' + col);
      zone.innerHTML = '';
      data[col].forEach(card => zone.appendChild(makeCardEl(card, col)));
      document.getElementById('count-' + col).textContent = data[col].length;
    });
    const total = COLS.reduce((s, c) => s + data[c].length, 0);
    document.getElementById('total-count').textContent = total + ' card' + (total !== 1 ? 's' : '');
  }

  function makeCardEl(card, col) {
    const el = document.createElement('div');
    el.className = 'card';
    el.draggable = true;
    el.dataset.id = card.id;
    el.dataset.col = col;

    el.innerHTML = `
      <button class="card-delete" title="Delete" onclick="deleteCard('${col}','${card.id}')">×</button>
      <div class="card-title">${escHtml(card.title)}</div>
      ${card.desc ? `<div class="card-meta">${escHtml(card.desc)}</div>` : ''}
      ${card.tag ? `<span class="${tagClass(card.tag)}">${card.tag}</span>` : ''}
    `;

    el.addEventListener('dragstart', e => {
      dragId = card.id;
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend', () => el.classList.remove('dragging'));
    return el;
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Drag-and-drop on drop zones
  document.querySelectorAll('.drop-zone').forEach(zone => {
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('over'));
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('over');
      const toCol = zone.id.replace('cards-', '');
      moveCard(dragId, toCol);
    });
  });

  function moveCard(id, toCol) {
    let card = null;
    COLS.forEach(col => {
      const idx = data[col].findIndex(c => c.id === id);
      if (idx !== -1) { [card] = data[col].splice(idx, 1); }
    });
    if (card) { data[toCol].push(card); save(); renderAll(); }
  }

  function deleteCard(col, id) {
    data[col] = data[col].filter(c => c.id !== id);
    save(); 
    renderAll();
  }

  // Modal
  function openModal(col) {
    targetCol = col;
    document.getElementById('inp-title').value = '';
    document.getElementById('inp-desc').value = '';
    document.getElementById('inp-tag').value = '';
    document.getElementById('modal').classList.add('open');
    setTimeout(() => document.getElementById('inp-title').focus(), 50);
  }

  function closeModal() { document.getElementById('modal').classList.remove('open'); }

  function addCard() {
    const title = document.getElementById('inp-title').value.trim();
    if (!title) { document.getElementById('inp-title').focus(); return; }
    const card = { id: uid(), title, desc: document.getElementById('inp-desc').value.trim(), tag: document.getElementById('inp-tag').value };
    data[targetCol].push(card);
    save(); renderAll(); closeModal();
  }

  // Close modal on overlay click
  document.getElementById('modal').addEventListener('click', e => { if (e.target === document.getElementById('modal')) closeModal(); });

  // Enter to submit modal
  document.getElementById('inp-title').addEventListener('keydown', e => { if (e.key === 'Enter') addCard(); });

  // Seed sample cards on first load
  if (!localStorage.getItem('kanban')) {
    data.todo  = [
      { id: uid(), title: 'Design login page', desc: 'Wireframes first', tag: 'design' },
      { id: uid(), title: 'Set up CI pipeline', desc: '', tag: 'feature' },
    ];
    data.doing = [
      { id: uid(), title: 'Fix navbar overflow bug', desc: 'Fails on mobile widths < 360px', tag: 'bug' },
    ];
    data.done  = [
      { id: uid(), title: 'Write README', desc: '', tag: 'docs' },
    ];
    save();
  }

  renderAll();
</script>
</body>
</html>
